[project]
name = "main-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=12.3.0",
    "alembic>=1.19.1",
    "asyncpg>=0.29.0",
    "celery>=5.3.6",
    "flower>=2.0.1",
    "dependency-injector>=4.41.0",
    "fastapi>=0.110.0",
    "gunicorn>=21.2.0",
    "httpx>=0.27.0",
    "opencv-python-headless>=5.0.0.93",
    "pgvector>=0.2.5",
    "pika>=1.3.2",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.29",
    "tenacity>=8.2.3",
    "uvicorn>=0.29.0",
    "sse-starlette>=3.4.8",
    "valkey>=6.1.1",
    "grpcio>=1.83.0",
    "grpcio-tools>=1.83.0",
    "redis>=8.1.0",
    "ruff>=0.16.4",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-celery>=1.3.0",
    "pytest-cov>=7.1.0",
    "testcontainers[postgres,rabbitmq,redis]>=4.15.0",
    "vulture>=2.16",
    "watchdog>=4.0.0",
]

[tool.vulture]
exclude = ['.venv', '.mypy_cache', '.pytest_cache', '.ruff_cache', '__pycache__']
paths = ['application', 'infrastructure', 'presentation', 'domain', '.vulture_whitelist.py']
