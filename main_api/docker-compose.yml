name: eventsnap

x-env-file: &env-file
  - .env

x-main-api-image: &main-api-image avneesh11905/main_api:latest

x-server-port: &server-port 
  - "8003:8000"

x-networks: &networks
  - Eventsnap-Network
  - Infrastructure-Network

networks:
  Eventsnap-Network:
    driver: bridge
  Infrastructure-Network:
    external: true

services:
  es-db_migration:
    image: *main-api-image
    container_name: eventsnap_migration
    command: infisical run --env=prod --path=/ -- alembic upgrade head
    env_file: *env-file
    networks: *networks

  es-main_api:
    image: *main-api-image
    ports: *server-port 
    env_file: *env-file
    depends_on:
      es-db_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: *networks

  es-celery_worker:
    image: *main-api-image
    command: infisical run --env=prod --path=/ -- celery -A infrastructure.queue.celery_app worker --loglevel=info --concurrency=4
    env_file: *env-file
    depends_on:
      es-db_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: *networks

  es-flower:
    image: *main-api-image
    container_name: eventsnap_flower
    command: infisical run --env=prod --path=/ -- celery -A infrastructure.queue.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: *env-file
    depends_on:
      es-db_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: *networks


