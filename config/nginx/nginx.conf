# Drop requests without a matching Host header (e.g. direct IP access)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Use the generated dummy certs for the default catch-all to prevent SSL handshake errors before dropping
    ssl_certificate         /etc/letsencrypt/live/eventsnap-api.aymahajan.in/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/eventsnap-api.aymahajan.in/privkey.pem;

    # No server_name directive here to prevent the certbot script from crashing.
    # The default_server flag on the listen directives is enough to catch unmatched traffic.
    return 444; # Closes the connection without sending a response
}

upstream uvicorn_api {
    server es-main-api:8000;
    keepalive 32; # Keep 32 connections alive to Uvicorn (prevents TCP handshake overhead)
}

upstream flower_api {
    server es-flower:5555;
}

server {
    # Listen to port 443 on both IPv4 and IPv6 with HTTP/2 enabled for faster multiplexing
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name eventsnap-api.aymahajan.in;

    ssl_certificate         /etc/letsencrypt/live/eventsnap-api.aymahajan.in/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/eventsnap-api.aymahajan.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/eventsnap-api.aymahajan.in/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    # Optimize for large image batch uploads
    client_max_body_size 200M;
    # Keep large POST bodies in RAM instead of writing to disk (significantly speeds up upload to Uvicorn)
    client_body_buffer_size 32M; 

    # Gzip compression for JSON responses (reduces bandwidth out)
    gzip on;
    gzip_types application/json;
    gzip_min_length 1000;

    location / {
        proxy_pass http://uvicorn_api;
        
        # Required for keepalive connections to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase proxy buffers so Nginx doesn't write Uvicorn's JSON response to disk
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Timeouts for large batches
        proxy_read_timeout 100s;
        proxy_connect_timeout 100s;
        proxy_send_timeout 100s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name celery.aymahajan.in;

    ssl_certificate         /etc/letsencrypt/live/celery.aymahajan.in/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/celery.aymahajan.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/celery.aymahajan.in/chain.pem;
    ssl_dhparam /etc/letsencrypt/dhparams/dhparam.pem;

    location /eventsnap/ {
        proxy_pass http://flower_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Flower Websockets
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
