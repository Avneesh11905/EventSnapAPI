name: eventsnap

x-env-file: &env-file
  - .env

networks:
  Eventsnap-Network:
    driver: bridge

volumes:
  main_api_venv:
  inference_api_venv:

services:
  es-inference_api:
    build: 
      context: ./inference_api
      dockerfile: Dockerfile.gpu
      target: development
    env_file: *env-file
    volumes:
      - ./inference_api:/app
      - inference_api_venv:/app/.venv
    ports:
      - "5000:5000"
    restart: unless-stopped
    command: >
      bash -c 'if [ -n "$$INFISICAL_TOKEN" ]; then infisical run -- uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 5000 --reload; else uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 5000 --reload; fi'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - Eventsnap-Network

  es-db_migration:
    build: 
      context: ./main_api
      target: development
    container_name: eventsnap_migration
    command: >
      bash -c 'if [ -n "$$INFISICAL_TOKEN" ]; then infisical run -- alembic upgrade head; else alembic upgrade head; fi'
    env_file: *env-file
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    restart: no
    networks:
      - Eventsnap-Network

  es-main_api:
    build: 
      context: ./main_api
      target: development
    env_file: *env-file
    ports:
      - "8000:8000"
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    command: >
      bash -c 'if [ -n "$$INFISICAL_TOKEN" ]; then infisical run -- uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 8000 --reload; else uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 8000 --reload; fi'
    depends_on:
      es-db_migration:
        condition: service_completed_successfully
      es-inference_api:
        condition: service_started
    restart: unless-stopped
    networks:
      - Eventsnap-Network

  es-celery_worker:
    build: 
      context: ./main_api
      target: development
    env_file: *env-file
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    command: >
      bash -c 'if [ -n "$$INFISICAL_TOKEN" ]; then infisical run -- watchmedo auto-restart --directory=/app --pattern="*.py" --recursive -- celery -A infrastructure.queue.celery_app worker --loglevel=info --concurrency=4; else watchmedo auto-restart --directory=/app --pattern="*.py" --recursive -- celery -A infrastructure.queue.celery_app worker --loglevel=info --concurrency=4; fi'
    depends_on:
      es-db_migration:
        condition: service_completed_successfully
      es-inference_api:
        condition: service_started
    restart: unless-stopped
    networks:
      - Eventsnap-Network

