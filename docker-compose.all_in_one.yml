name: eventsnap

x-env-file: &env-file
  - .env

x-db-network: &db-network
  - Observer-Network
  - Eventsnap-Network

networks:
  Observer-Network:
    external: true
  Eventsnap-Network:
    driver: bridge

volumes:
  rabbitmq_data:
  main_api_venv:
  inference_api_venv:

services:
  es-rabbitmq:
    image: rabbitmq:3-management
    container_name: es-rabbitmq
    restart: unless-stopped
    env_file: *env-file
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - Eventsnap-Network
      
  es-minio:
    image: minio/minio:latest
    container_name: eventsnap_minio
    command: server /data --console-address ":9001"
    env_file: *env-file
    volumes:
      - ./data/minio:/data
    ports:
      - "9001:9001" 
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://es-minio:9000/minio/health/live"]
    restart: unless-stopped
    networks:
      - Eventsnap-Network

  es-postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: eventsnap_db
    env_file: *env-file
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres/data:/var/lib/postgresql
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: *db-network

  es-inference_api:
    build: 
      context: ./inference_api
      dockerfile: Dockerfile.gpu
      target: development
    volumes:
      - ./inference_api:/app
      - inference_api_venv:/app/.venv
    command: >
      bash -c 'if [ -n "$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" ] && [ -z "$$INFISICAL_TOKEN" ]; then export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" --client-secret="$$INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET" --plain --silent); fi; if [ -n "$$INFISICAL_TOKEN" ]; then infisical run --projectId "$$INFISICAL_PROJECT_ID" --env="$${INFISICAL_ENVIRONMENT:-dev}" -- uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 5000 --reload; else uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 5000 --reload; fi'
    ports:
      - "5000:5000"
    env_file: *env-file
    restart: unless-stopped
    networks:
      - Eventsnap-Network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  es-db_migration:
    build: 
      context: ./main_api
      target: development
    container_name: eventsnap_migration
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    command: >
      bash -c 'if [ -n "$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" ] && [ -z "$$INFISICAL_TOKEN" ]; then export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" --client-secret="$$INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET" --plain --silent); fi; if [ -n "$$INFISICAL_TOKEN" ]; then infisical run --projectId "$$INFISICAL_PROJECT_ID" --env="$${INFISICAL_ENVIRONMENT:-dev}" -- alembic upgrade head; else alembic upgrade head; fi'
    env_file: *env-file
    depends_on:
      es-postgres:
        condition: service_healthy
    networks:
      - Eventsnap-Network

  es-main_api:
    build: 
      context: ./main_api
      target: development
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file: *env-file
    command: >
      bash -c 'if [ -n "$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" ] && [ -z "$$INFISICAL_TOKEN" ]; then export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" --client-secret="$$INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET" --plain --silent); fi; if [ -n "$$INFISICAL_TOKEN" ]; then infisical run --projectId "$$INFISICAL_PROJECT_ID" --env="$${INFISICAL_ENVIRONMENT:-dev}" -- uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 8000 --reload; else uv run uvicorn presentation.api.main:app --host 0.0.0.0 --port 8000 --reload; fi'
    depends_on:
      es-rabbitmq:
        condition: service_started
      es-postgres:
        condition: service_healthy
      es-db_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - Eventsnap-Network

  es-celery_worker:
    build: 
      context: ./main_api
      target: development
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    command: >
      bash -c 'if [ -n "$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" ] && [ -z "$$INFISICAL_TOKEN" ]; then export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" --client-secret="$$INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET" --plain --silent); fi; if [ -n "$$INFISICAL_TOKEN" ]; then infisical run --projectId "$$INFISICAL_PROJECT_ID" --env="$${INFISICAL_ENVIRONMENT:-dev}" -- watchmedo auto-restart --directory=/app --pattern="*.py" --recursive -- celery -A infrastructure.queue.celery_app worker --loglevel=info --concurrency=4; else watchmedo auto-restart --directory=/app --pattern="*.py" --recursive -- celery -A infrastructure.queue.celery_app worker --loglevel=info --concurrency=4; fi'
    env_file: *env-file
    depends_on:
      es-postgres:
        condition: service_healthy
      es-db_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - Eventsnap-Network

  es-celery_flower:
    build: 
      context: ./main_api
      target: development
    env_file: *env-file
    ports:
      - "5555:5555"
    volumes:
      - ./main_api:/app
      - main_api_venv:/app/.venv
    command: >
      bash -c 'if [ -n "$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" ] && [ -z "$$INFISICAL_TOKEN" ]; then export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="$$INFISICAL_MACHINE_IDENTITY_CLIENT_ID" --client-secret="$$INFISICAL_MACHINE_IDENTITY_CLIENT_SECRET" --plain --silent); fi; if [ -n "$$INFISICAL_TOKEN" ]; then infisical run --projectId "$$INFISICAL_PROJECT_ID" --env="$${INFISICAL_ENVIRONMENT:-dev}" -- watchmedo auto-restart --directory=/app --pattern="*.py" --recursive -- celery -A infrastructure.queue.celery_app flower --port=5555; else watchmedo auto-restart --directory=/app --pattern="*.py" --recursive -- celery -A infrastructure.queue.celery_app flower --port=5555; fi'
    depends_on:
      es-rabbitmq:
        condition: service_started
    restart: unless-stopped
    networks:
      - Eventsnap-Network

